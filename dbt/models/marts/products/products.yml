version: 2

models:
  - name: mart_product_category_performance
    description: "Product category performance mart summarising sales, logistics and customer satisfaction metrics. One row represents one product category."

    columns:
      - name: product_category_name
        description: "Product category displayed in English where a translation exists."

        tests:
          - unique

      - name: total_revenue
        description: "Total item revenue generated by the product category."

      - name: total_orders
        description: "Distinct number of orders containing products from the category."

      - name: total_items_sold
        description: "Total number of order items sold within the category."

      - name: average_review_score
        description: "Average review score associated with orders containing the category."

      - name: average_delivery_days
        description: "Average delivery time in days."

      - name: late_delivery_rate
        description: "Percentage of orders delivered later than the estimated delivery date."